  <body>

    <button id="musicToggle" class="music-toggle-btn" aria-label="Toggle background music" type="button" title="Play / Pause Music">

      <svg id="musicIconPlay" class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <style>
      /* Normal modern digits for Cormorant Garamond */
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(external/fonts.gstatic.com/s/jost/v20/92zatBhPNqw77obX5RYk.woff2) format('woff2');
        unicode-range: U+0030-0039;
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(external/fonts.gstatic.com/s/jost/v20/92zatBhPNqw77obX5RYk.woff2) format('woff2');
        unicode-range: U+0030-0039;
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(external/fonts.gstatic.com/s/jost/v20/92zatBhPNqw77obX5RYk.woff2) format('woff2');
        unicode-range: U+0030-0039;
      }
      .date-normal-num {
        font-family: 'Jost', sans-serif !important;
        font-weight: 600 !important;
        display: inline-block;
        letter-spacing: 0.02em;
      }

      .music-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(30, 8, 14, 0.8);
        border: 1.5px solid rgba(217, 164, 65, 0.7);
        color: #f6e2ae;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 12px rgba(217, 164, 65, 0.35);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.3s ease;
        outline: none;
        padding: 0;
      }
      .music-toggle-btn:hover {
        transform: scale(1.08);
        border-color: #f6e2ae;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 18px rgba(217, 164, 65, 0.55);
      }
      .music-toggle-btn .music-icon {
        width: 20px;
        height: 20px;
        stroke: #f6e2ae;
        transition: transform 0.3s ease;
      }
      .music-toggle-btn.is-playing .music-icon {
        animation: music-spin 8s linear infinite;
      }
      @keyframes music-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .music-pulse {
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1px solid rgba(217, 164, 65, 0.45);
        animation: music-glow 2.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes music-glow {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.18); opacity: 0.85; }
      }
      .music-toggle-btn .hidden {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        var audio = document.getElementById('weddingBgm');
        var btn = document.getElementById('musicToggle');
        var iconPlay = document.getElementById('musicIconPlay');
        var iconMute = document.getElementById('musicIconMute');
        var isPlaying = false;

        function updateState(playing) {
          isPlaying = playing;
          if (playing) {
            btn.classList.add('is-playing');
            iconPlay.classList.remove('hidden');
            iconMute.classList.add('hidden');
          } else {
            btn.classList.remove('is-playing');
            iconPlay.classList.add('hidden');
            iconMute.classList.remove('hidden');
          }
        }

        window.playWeddingMusic = function() {
          if (audio && audio.paused) {
            audio.play().then(function() {
              updateState(true);
            }).catch(function() {});
          }
        };

        function toggleMusic(e) {
          if (e) e.stopPropagation();
          if (audio.paused) {
            audio.play().then(function() {
              updateState(true);
            }).catch(function() {
              updateState(false);
            });
          } else {
            audio.pause();
            updateState(false);
          }
        }

        if (btn) {
          btn.addEventListener('click', toggleMusic);
        }

        function onFirstInteract() {
          if (!isPlaying && audio) {
            audio.play().then(function() {
              updateState(true);
              removeInteractListeners();
            }).catch(function() {});
          }
        }

        function removeInteractListeners() {
          document.removeEventListener('click', onFirstInteract);
          document.removeEventListener('touchstart', onFirstInteract);
        }

        document.addEventListener('click', onFirstInteract);
        document.addEventListener('touchstart', onFirstInteract);
      })();
    </script>
  </body>
